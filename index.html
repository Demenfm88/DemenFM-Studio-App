
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demen FM Studio</title>
<meta name="theme-color" content="#071b36">
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b36;color:white;font-family:Arial,sans-serif}
header{background:#087eaa;text-align:center;padding:22px 10px}
header h1{margin:0;color:#ffdf45;font-size:27px}
header p{margin:7px 0 0}
main{padding:18px;max-width:500px;margin:auto}
.panel{background:#102c4d;padding:18px;border-radius:14px;margin-bottom:16px}
h2{font-size:19px;margin:0 0 15px;color:#ffdf45}
button{width:100%;padding:15px;border:0;border-radius:9px;font-size:16px;font-weight:bold;margin:6px 0;cursor:pointer}
.start{background:#16b86a;color:white}
.stop{background:#e34242;color:white}
.blue{background:#087eaa;color:white}
.status{background:#061629;padding:14px;border-radius:8px;text-align:center;color:#ffdf45}
input{width:100%;padding:13px;border-radius:8px;border:0;margin:7px 0}
footer{text-align:center;color:#9bb5cc;padding:20px;font-size:12px}
</style>
</head>
<body>

<header>
<h1>DEMEN FM 88</h1>
<p>STUDIO ADMIN</p>
<p>Emang Ndemenin - Radionya Cilacap</p>
</header>

<main>

<div class="panel">
<h2>🎵 AUTO DJ</h2>
<div class="status" id="status">AUTO DJ SIAP</div>
<button class="start" onclick="mulai()">▶ MULAI AUTO DJ</button>
<button class="stop" onclick="berhenti()">■ STOP AUTO DJ</button>
</div>

<div class="panel">
<h2>📻 KONTROL SIARAN</h2>
<div class="status">DEMEN FM 88</div>
<button class="blue" onclick="alert('Menu siaran Demen FM')">BUKA KONTROL SIARAN</button>
</div>

<div class="panel">
<h2>🎙️ STUDIO PENYIAR</h2>
<button class="blue" onclick="alert('Menu microphone')">AKTIFKAN MIC</button>
<button class="stop" onclick="alert('Microphone dimatikan')">MATIKAN MIC</button>
</div>

<div class="panel">
<h2>📂 DAFTAR MUSIK</h2>
<input type="file" accept="audio/*" multiple>
<p>Pilih file musik dari HP.</p>
</div>

</main>

<footer>DEMEN FM 88 © 2026<br>Studio Admin</footer>

<script>
function mulai(){
document.getElementById("status").innerText="AUTO DJ SIAP DIJALANKAN";
}
function berhenti(){
document.getElementById("status").innerText="AUTO DJ DIHENTIKAN";
}
</script>

</body>
</html>
