
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071b36">
<title>Demen FM Studio</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#071b36;
 color:white;
 text-align:center;
}
header{
 background:#087eaa;
 padding:25px 15px;
}
.logo{
 font-size:48px;
 font-weight:bold;
 color:#ffd84d;
}
h1{margin:5px 0;font-size:25px}
main{padding:20px}
.panel{
 background:#102d4d;
 border-radius:15px;
 padding:20px;
 margin:15px auto;
 max-width:450px;
}
.status{
 color:#50e69a;
 font-size:20px;
 font-weight:bold;
}
.song{
 font-size:17px;
 color:#ffd84d;
 margin:15px 0;
}
button{
 width:100%;
 padding:15px;
 margin:8px 0;
 border:0;
 border-radius:10px;
 font-size:17px;
 font-weight:bold;
}
.start{background:#12b76a;color:white}
.stop{background:#dc3545;color:white}
.refresh{background:#087eaa;color:white}
small{color:#b9c9d8}
</style>
</head>
<body>

<header>
 <div class="logo">88</div>
 <h1>DEMEN FM STUDIO</h1>
 <div>Emang Ndemenin</div>
</header>

<main>
 <div class="panel">
  <h2>📻 KONTROL AUTO DJ</h2>
  <div class="status" id="status">MEMERIKSA...</div>
  <div class="song" id="song">Menunggu informasi lagu</div>
  <button class="refresh" onclick="cekStatus()">CEK STATUS</button>
  <button class="start" onclick="kontrol('start')">▶ START AUTO DJ</button>
  <button class="stop" onclick="kontrol('stop')">■ STOP AUTO DJ</button>
 </div>
 <small>Demen FM 88 - Radionya Cilacap</small>
</main>

<script>
async function cekStatus(){
 try{
  const r=await fetch('/status');
  const d=await r.json();
  document.getElementById('status').textContent=
   d.running?'AUTO DJ AKTIF':'AUTO DJ MATI';
  document.getElementById('song').textContent=
   d.song||d.current_song||'Informasi lagu belum tersedia';
 }catch(e){
  document.getElementById('status').textContent='SERVER TIDAK TERHUBUNG';
 }
}
async function kontrol(aksi){
 if(!confirm('Jalankan perintah '+aksi+' Auto DJ?'))return;
 try{
  const r=await fetch('/'+aksi,{method:'POST'});
  alert(await r.text());
  cekStatus();
 }catch(e){
  alert('Perintah gagal. Periksa server.');
 }
}
cekStatus();
setInterval(cekStatus,5000);
</script>

</body>
</html>
